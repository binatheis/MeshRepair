name: wheels

# Build native tests + Python wheels (cp311-abi3) on 3 platforms.
# Single job per platform: conan install -> cmake build -> ctest -> wheel -> pytest.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cibw_os: linux
            cibw_arch: x86_64
          - os: windows-2022
            cibw_os: windows
            cibw_arch: AMD64
          - os: macos-15
            cibw_os: macos
            cibw_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Conan
        uses: conan-io/setup-conan@v1

      - name: Conan profile detect
        run: conan profile detect --force

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conanfile.py') }}

      - name: Conan install
        run: conan install . -of conan-out -b missing -s build_type=Release -s compiler.cppstd=20

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=conan-out/conan_toolchain.cmake \
            -DCMAKE_PREFIX_PATH=conan-out \
            -DBUILD_MESHREPAIR_GUI=OFF \
            -DMESHREPAIR_ENABLE_NATIVE_ARCH=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows / macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=conan-out/conan_toolchain.cmake \
            -DCMAKE_PREFIX_PATH=conan-out \
            -DBUILD_MESHREPAIR_GUI=OFF \
            -DMESHREPAIR_ENABLE_NATIVE_ARCH=OFF

      - name: Build native
        run: cmake --build build --config Release

      - name: Native tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build & test wheel
        uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: bindings/python
          output-dir: wheelhouse
        env:
          CIBW_BUILD: cp311-abi3-*
          CIBW_ARCHS: ${{ matrix.cibw_arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.cibw_os }}-${{ matrix.cibw_arch }}
          path: wheelhouse/*.whl


# MeshRepair Python binding — nanobind + scikit-build-core + Conan.
#
# Build a wheel locally:
#   conan install . -of conan-out -b missing -s build_type=Release
#   CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=$PWD/conan-out/conan_toolchain.cmake -DCMAKE_PREFIX_PATH=$PWD/conan-out" \
#     pip wheel bindings/python -w wheelhouse
#
# Or with cibuildwheel (see [tool.cibuildwheel] below for the exact recipe).

[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.13,<3"]
build-backend = "scikit_build_core.build"

[project]
name = "meshrepair"
version = "2.8.0"
description = "Mesh hole filling and repair (CGAL Liepa/Botsch) with a partitioned parallel pipeline"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "MeshRepair contributors" }]
keywords = ["mesh", "repair", "hole-filling", "cgal", "geometry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.source-dir = "../.."
wheel.packages = ["src/meshrepair"]
# Stable ABI: one wheel per platform, valid for CPython 3.11 -> 3.14.
wheel.py-api = "cp311"
build-dir = "build/{wheel_tag}"
sdist.include = [
    "../../meshrepair/**",
    "../../CMakeLists.txt",
    "../../conanfile.py",
    "../../cmake/**",
]

[tool.cibuildwheel]
# Native tests + Conan install run on the host before cibuildwheel.
# Linux: cibuildwheel runs in manylinux Docker, needs its own Conan install.
# Windows/macOS: cibuildwheel runs on the host, reuses the existing Conan install.

[tool.cibuildwheel.config-settings]
cmake_args = [
    "-DCMAKE_TOOLCHAIN_FILE={project}/conan-out/conan_toolchain.cmake",
    "-DCMAKE_PREFIX_PATH={project}/conan-out",
]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
environment = { CONAN_HOME = "{project}/.conan-home" }
before-all = "pip install conan && conan profile detect --force && conan install . -of conan-out -b missing -s build_type=Release -s compiler.cppstd=20"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "13.0" }

[tool.cibuildwheel.test]
requires = ["pytest"]
command = "pytest {project}/bindings/python/tests -v"
